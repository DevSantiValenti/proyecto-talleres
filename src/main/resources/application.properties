spring.application.name=taller
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lavadero?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:chuflitos1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.thymeleaf.cache=true
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.nombre=GVG Factory Motos
# URL publica usada en enlaces, QR de tickets y recordatorios. Sin barra final.
# Cambia el valor por tu tunel o dominio y reinicia la aplicacion.
# Ejemplos: https://mi-tunel.trycloudflare.com | https://taller.midominio.com
# APP_BASE_URL permite sobrescribirla; PUBLIC_URL se conserva por compatibilidad.
# app.base-url=${APP_BASE_URL:${PUBLIC_URL:http://localhost:8080}}
app.base-url=https://boulevard-copy-kay-modular.trycloudflare.com

app.zone=America/Argentina/Cordoba
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin1234567}
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-id=${WHATSAPP_PHONE_ID:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.template=${WHATSAPP_TEMPLATE:recordatorio_service}
app.whatsapp.language=${WHATSAPP_LANGUAGE:es_AR}
app.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v23.0}
